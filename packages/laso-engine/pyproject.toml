[project]
name = "laso-engine"
version = "0.1.0"
description = "Engine an lá số Tử Vi — thuần Python, không phụ thuộc ngoài"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laso_engine"]

[tool.coverage.report]
fail_under = 80
