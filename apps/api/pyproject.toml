[project]
name = "tuvi-api"
version = "0.1.0"
description = "Backend API của Tử Vi AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "laso-engine",
]

[tool.uv.sources]
laso-engine = { workspace = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
